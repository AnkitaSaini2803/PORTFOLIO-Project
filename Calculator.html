<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        background:#f4f4f4;
    }

    .calculator{
        width:320px;
        background:white;
        padding:20px;
        border-radius:15px;
        box-shadow:0 0 15px rgba(0,0,0,0.2);
    }

    .display{
        width:100%;
        height:70px;
        margin-bottom:15px;
        border:none;
        outline:none;
        background:#eee;
        border-radius:10px;
        text-align:right;
        font-size:2rem;
        padding:10px;
    }

    .buttons{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:10px;
    }

    button{
        height:60px;
        border:none;
        border-radius:10px;
        font-size:1.2rem;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        transform:scale(1.05);
    }

    .operator{
        background:#ff9500;
        color:white;
    }

    .equal{
        background:#28a745;
        color:white;
        grid-column:span 2;
    }

    .clear{
        background:#dc3545;
        color:white;
    }

    .number{
        background:#ddd;
    }
</style>
</head>

<body>

<div class="calculator">
    <!-- Display ke liye  -->
    <input type="text" class="display" readonly>   

    <div class="buttons">

        <button class="clear">C</button>
        <button class="operator">%</button>
        <button class="operator">/</button>
        <button class="operator">*</button>

        <button class="number">7</button>
        <button class="number">8</button>
        <button class="number">9</button>
        <button class="operator">-</button>

        <button class="number">4</button>
        <button class="number">5</button>
        <button class="number">6</button>
        <button class="operator">+</button>

        <button class="number">1</button>
        <button class="number">2</button>
        <button class="number">3</button>
        <button class="operator">.</button>

        <button class="number">0</button>
        <button class="equal">=</button>

    </div>

</div>

<script>

    const btn=document.querySelectorAll('button');
    // btn.forEach(function(button){
    //     button.addEventListener('click',()=>{
    //         console.log(button.textContent);
    //         // current=button.textContent;
    //         // console.log(typeof current)

    //     });
    // });
    const display=document.querySelector('.display')
    // To select all elements having class number
    const number=document.querySelectorAll('.number')
    // To select all elements having class operator
    const ooperator=document.querySelectorAll('.operator')
    // To select equal
    const equal=document.querySelector('.equal')
    // To select clear
    const clear=document.querySelector('.clear')

    number.forEach(function(btn){
        btn.addEventListener('click',()=>{
            display.value+=btn.textContent;
        });
    });

    ooperator.forEach(function(btn){
        btn.addEventListener('click',()=>{
            // display.value+=btn.textContent
            // let varr=display.value.length-1
            let lastchar=display.value.slice(-1)
            let arr=['+','-','*','/','%']
            if(display.value==='')
            {
                if(btn.textContent === '-')
                {
                display.value += '-';
                }
                return ;
            }

                   //stops execution even when you will type any operator 
                        //    because display is empty ...condition is satisfied
            
            // console.log("Hello ",display.value.length-1)
            // display.value is a string and we apply splice operator on array
            // if (arr.includes(display.value[varr]))
            if(arr.includes(lastchar))
            {
                //    display.value=display.value.splice(varr,1,btn.textContent)
                display.value=display.value.slice(0,-1)+ btn.textContent
            }
            else{
                display.value+=btn.textContent;
            }
    
            // else if(btn.textContent==='-'){
            //     btn.textContent+='';
            // }
            // else if(btn.textContent==='%'){
            //     btn.textContent+='';
            // }
            // else if(btn.textContent==='*'){
            //     btn.textContent+='';
            // }
            // else if(btn.textContent==='/'){
            //     btn.textContent+='';
            
            
        })
    })
     
    clear.addEventListener('click',()=>{
        display.value="";
    })

    
    equal.addEventListener('click',()=>{
        display.value=eval(display.value)
    })
    
</script>
</body>
</html>
