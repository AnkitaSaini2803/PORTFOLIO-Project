<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box Grid</title>

    <style>

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        /* Main Container */
        .container{
            width:80vw;
            height:80vh;
            border:4px solid gray;

            display:flex;
            flex-direction:column;
            gap:10px;
            padding:10px;
        }

        /* Row */
        .row{
            display:flex;   /* Makes boxes horizontal */
            flex:1;
            gap:10px;
        }

        /* Boxes */
        .box{
            flex:1;
            background-color:lightblue;
            border:2px solid black;
            
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="row">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>

        <div class="row">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>

        <div class="row">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>

    </div>

</body>
</html>
